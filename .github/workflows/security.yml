name: Security and integrity
on:
  push:
  pull_request:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      DEBUG: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-security.txt
      - name: Compare committed release manifest
        run: python manage.py security_manifest --check
      - run: python manage.py test
      - name: Static analysis and dependency advisories
        if: always()
        run: python manage.py security_scan
