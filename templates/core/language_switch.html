{% load i18n %}<form class="language-switch" method="post" action="{% url 'set_language' %}" data-language-form>{% csrf_token %}<input type="hidden" name="next" value="{% if request.method == 'GET' %}{{ request.get_full_path }}{% else %}/{% endif %}"><label for="interface-language" class="visually-hidden">{% translate "Idioma de la interfaz" %}</label><select id="interface-language" name="language" aria-label="{% translate "Idioma de la interfaz" %}"><option value="es" {% if language_code == 'es' %}selected{% endif %}>Español</option><option value="en" {% if language_code == 'en' %}selected{% endif %}>English</option></select><button class="language-apply" aria-label="{% translate "Aplicar idioma" %}">↵</button></form>
